services:
  - type: web
    name: sistema-financeiro-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run generate:prod -w packages/database && npm run build -w apps/api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 3333
      - key: UPLOADS_DIR
        value: ./uploads
